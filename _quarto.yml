website:
  title: "PSYC559: Applied Machine Learning in Psychology"

  # -----------------------------------------------------------------
  # SEQUENTIAL CONTENT RELEASE (fully manual)
  #
  # Every page listed under `drafts:` is hidden from the published
  # site: it renders as an empty page with no sidebar link and no
  # search entry.
  #
  # To release content: delete (or comment out with #) its lines
  # below, re-render the site, review, and push to GitHub. Nothing
  # is released until you do all of that yourself.
  #
  # The date comments are the planned class days from the Fall 2026
  # syllabus — they are labels for you, nothing reads them.
  # -----------------------------------------------------------------
  draft-mode: gone
  drafts:
    # (released 8/12 — Introduction to R section: 1_1, 1_1b, 1_2, week1_3, week1_4)
    # (released 8/28 — Fundamentals of ML: week2_1, week2_2)
    # (released 8/29 — General modeling pipelines: week2_3, week2_4)
    # (released 9/6 — Feature engineering: week2_5a through week2_5g)
    # (released 9/6 — Linear regression: week3_1, week3_2)
    # 9/8 — Logistic regression
    - week3_3.qmd
    - week3_4.qmd
    # 9/10 — Regularized regression
    - week4_1.qmd
    # 9/22 — KNN and decision trees
    - week5_1.qmd
    # 9/24 — Bagging and random forests
    - week5_2.qmd
    - week5_3.qmd
    # 9/29 — Gradient boosting
    - week5_4.qmd
    # 10/22 — K-means clustering
    - week6_3.qmd
    # 10/27 — Hierarchical clustering
    - week6_2.qmd
    # 11/5 — Principal components analysis
    - week6_1.qmd

  sidebar:
    style: "docked"
    search: false
    contents:
      - text: "Table of Contents"
        href: introduction.qmd
        contents:
      - section: "Course Foundations"
